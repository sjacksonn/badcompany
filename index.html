<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#000000">
<meta property="og:title" content="BAD COMPANY">
<meta property="og:description" content="BAD COMPANY is an experimental vibe coding space ft. games, experiments, experiences &amp; tools. Run by Sam, co-founder of Ø Group/MØRNING/EVENING.">

<meta name="twitter:title" content="BAD COMPANY">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='Helvetica,Arial' font-weight='700' font-size='40' text-anchor='middle' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:fixed;inset:0;display:none}
.app.on{display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:0 22px;min-height:48px;font-weight:800;font-size:16px;text-decoration:none;white-space:nowrap;border:1.5px solid #fff;background:transparent;letter-spacing:.01em}
.pill.solid{background:#fff;color:#000}
.pill:focus-visible,.row:focus-visible,.nav:focus-visible{outline:3px solid #fff;outline-offset:3px}
.word{font-weight:900;font-size:22px;letter-spacing:-.02em}
.ab{min-height:40px;padding:0 16px;font-size:14px}

/* ===== B · INDEX ===== */
#B{padding:max(16px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}
#B .frame{height:100%;display:flex;flex-direction:column}
#B .head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 22px}
#B .tag{display:none;font-size:14px;opacity:.55}
#B .list{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;overflow:hidden}
#B .row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1.5px solid rgba(255,255,255,.2);padding:8px 0 4px;transition:opacity .25s;cursor:pointer}
#B .row:last-child{border-bottom:1.5px solid rgba(255,255,255,.2)}
#B .line{display:flex;align-items:baseline;gap:12px}
#B .n{font-size:12px;width:22px;flex:none}
#B .name{font-weight:900;font-size:clamp(40px,11.6vw,124px);line-height:.92;letter-spacing:-.045em;transition:transform .35s}
#B .meta{display:none;margin-left:auto;font-size:15px;text-align:right;white-space:nowrap}
#B .ghost .name{color:transparent;-webkit-text-stroke:1.3px rgba(255,255,255,.4)}
#B .list.hovering .row{opacity:.28}
@media not ((min-width:900px) and (hover:hover)){#B .list.hovering .row:not(.on) .name{font-size:clamp(30px,8.6vw,80px)}}
#B .list.hovering .row.on{opacity:1;border-top-color:#fff}
@media (min-width:900px) and (hover:hover){#B .row.on .name{transform:translateX(10px)}}
#B .open{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
#B .row.on .open{grid-template-rows:1fr}
#B .open>div{overflow:hidden}
#B .clipm{position:relative;margin:10px 0;border-radius:18px;overflow:hidden;height:min(27vh,240px);border:1.5px solid #fff;background:#111}
#B .clipm img,#B .clipm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#B .obtns{display:flex;gap:10px;padding-bottom:12px}
#B .obtns .pill{flex:1}
#B .foot{display:flex;justify-content:space-between;font-size:12px;opacity:.5;gap:10px;margin-top:16px}
#B .foot .hide-s{display:none}
#B .card{display:none}
/* square view switch + full-width about bar */
#B .vt{display:flex;border:1.5px solid #fff}
#B .vt button{border:0;background:none;min-height:40px;padding:0 14px;font-size:13px;font-weight:800;letter-spacing:.03em}
#B .vt button.on{background:#fff;color:#000}
#B .vt button:focus-visible,.aboutbar:focus-visible{outline:3px solid #fff;outline-offset:3px}
#B .bhint{font-size:9.5px;letter-spacing:.04em;opacity:.45;margin:12px 0 10px}
/* About: one box pinned to the bottom that grows upwards over the page */
#B .abslot{position:relative;height:56px;flex:none}
#B .abox{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#000;border:1.5px solid #fff;display:flex;flex-direction:column-reverse}
#B .abox .aboutbar{border:0;min-height:53px}
#B .aboutbar i{display:inline-block;font-size:22px;transition:transform .3s}
#B .abox.on .aboutbar i{transform:rotate(45deg)}
#B .abBody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
#B .abox.on .abBody{grid-template-rows:1fr}
#B .abIn{overflow:hidden;padding:0 18px}
#B .abIn p{margin:0 0 12px;font-size:16px;line-height:1.2;max-width:640px}
#B .abIn p:first-child{padding-top:18px}
#B .abIn a{text-decoration:underline;text-underline-offset:.12em}
#B .abIn .c{font-size:10px;opacity:.5;padding-bottom:6px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.2)}
@media (min-width:900px){#B .abIn p{font-size:20px}#B .abIn .c{font-size:11px}}
#B .abShade{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
#B.abo .abShade{opacity:1;pointer-events:auto}
.aboutbar{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 18px;border:1.5px solid #fff;border-radius:0;background:#000;font-weight:900;font-size:18px;letter-spacing:-.01em;flex:none}
.aboutbar i{font-style:normal;font-size:26px;font-weight:500;line-height:1}
/* tiles view */
#B .tiles{display:none;flex:1;min-height:0;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;align-items:center;scrollbar-width:none;margin:0 -18px;padding:0 18px;scroll-padding:0 18px}
#B .tiles::-webkit-scrollbar{display:none}
#B.tv .list{display:none}#B.tv .tiles{display:flex}
#B .tile{position:relative;flex:none;aspect-ratio:345/465;border-radius:24px;overflow:hidden;scroll-snap-align:center;background:#111}
#B .tile img.bg,#B .tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#B .tile img.lg{position:absolute;left:8%;width:84%;top:6%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
#B .tile video{opacity:0;pointer-events:none;transition:opacity .3s;background:#000;z-index:3}
#B .tile.playing video{opacity:1;pointer-events:auto}
#B .tile .tb{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;gap:8px;z-index:4}
#B .tile .tb .pill{min-height:42px;font-size:14px;padding:0 16px}
#B .tile .tb .trl{background:rgba(0,0,0,.55)}
#B .tile.playing .tb .trl{display:none}
#B .tile .tx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.55);z-index:5;display:none}
#B .tile.playing .tx{display:block}
#B .tile.soon{background:#000;border:1.5px dashed rgba(255,255,255,.7);display:grid;place-items:center;font-weight:900;font-size:30px;line-height:.92;text-align:center}
@media (min-width:900px){#B .tiles{margin:0 -48px;padding:0 48px;scroll-padding:0 48px}#B .tile{scroll-snap-align:start}}
@media (min-width:900px) and (hover:hover){
 #B{padding:max(28px,env(safe-area-inset-top)) 48px 36px}
 #B .tag{display:block}
 #B .meta{display:block}
 #B .n{font-size:16px;width:60px}
 #B .open{display:none}
 #B .foot{font-size:14px}
 #B .foot .hide-s{display:inline}
 #B .card{display:block;position:fixed;left:0;top:0;width:280px;aspect-ratio:345/465;border-radius:22px;overflow:hidden;border:1.5px solid #fff;box-shadow:0 24px 60px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;background:#111}
 #B .card.on{opacity:1}
 #B .card img,#B .card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 #B .card .lg{inset:auto;left:8%;width:84%;top:6%;height:auto}
 #B .card video{opacity:0;transition:opacity .4s}#B .card video.ready{opacity:1}
 #B .card .cue{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:13px;font-weight:800}
 #B .card .cue span{background:#fff;color:#000;border-radius:99px;padding:8px 16px}
}


/* credits: i buttons */
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.55);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:19px;line-height:1;display:grid;place-items:center;padding:0}
.ib:focus-visible{outline:3px solid #fff;outline-offset:3px}
#B .obtns .ib{width:48px;height:48px}
#B .line .ib{display:none;align-self:center;margin-left:18px;width:34px;height:34px;font-size:16px;opacity:.55;transition:opacity .2s}
#B .row.on .line .ib,#B .line .ib:hover{opacity:1}
#B .tile>.ib{position:absolute;top:12px;right:12px;z-index:5}
#B .tile.playing>.ib{display:none}
#B .tile{transition:transform .18s ease-in}
#B .tile.turning{transform:scaleX(.02)}
#B .tile .back{position:absolute;inset:0;z-index:6;background:#000;border:1.5px solid #fff;border-radius:24px;display:none;flex-direction:column;justify-content:center;padding:26px 24px;text-align:left;cursor:pointer}
#B .tile.cr .back{display:flex}
#B .back h3{font-weight:900;font-size:min(6vw,24px);letter-spacing:-.02em;margin:0 0 18px}
#B .back dl{margin:0}
#B .back dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin:0 0 3px}
#B .back dd{margin:0 0 14px;font-size:min(4vw,16px);font-weight:500}
#B .back a{text-decoration:underline;text-underline-offset:.12em}
#B .back .bx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid #fff;background:none;font-size:15px}
#B .abIn h3{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0;padding-top:18px}
#B .abIn dl{margin:12px 0 4px}
#B .abIn dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin:0 0 3px}
#B .abIn dd{margin:0 0 12px;font-size:16px;font-weight:500}
@media (min-width:900px) and (hover:hover){#B .line .ib{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app on" id="B" aria-label="BAD COMPANY">
  <div class="frame">
    <div class="head"><span class="word">BAD COMPANY</span><span class="tag">SHIT POSTING GAMES, EXPERIMENTS &amp; TOOLS</span>
      <div class="vt" role="group" aria-label="View"><button type="button" data-v="list" class="on" aria-pressed="true">LIST</button><button type="button" data-v="tiles" aria-pressed="false">TILES</button></div></div>
    <div class="list" id="list"></div>
    <div class="tiles" id="btiles"></div>
    <span class="bhint" id="bhint">TAP A NAME TO OPEN IT</span>
    <div class="abslot"><div class="abox" id="abox">
      <button class="aboutbar" id="abBtn" type="button" aria-expanded="false" aria-controls="abBody">ABOUT <i aria-hidden="true">+</i></button>
      <div class="abBody" id="abBody"><div class="abIn" id="abIn">
        <p>BAD COMPANY is an experimental vibe coding space ft. games, experiments, experiences &amp; tools. Run by Sam, co-founder of <a href="https://instagram.com/morning.fyi" target="_blank" rel="noopener">Ø&nbsp;Group</a>/<a href="https://morning.fyi" target="_blank" rel="noopener">MØRNING</a>/<a href="https://evening.fyi" target="_blank" rel="noopener">EVENING</a>.</p>
        <p><a href="mailto:contact@badcompany.fyi">contact@badcompany.fyi</a></p>
        <p class="c">© 2026 BAD COMPANY. ALL RIGHTS RESERVED.</p>
      </div></div>
    </div></div>
  </div>
  <div class="abShade" id="abShade"></div>
  <div class="card" id="card" aria-hidden="true"><img id="cardBg" alt=""><video id="cardV" muted playsinline loop></video><img class="lg" id="cardLg" alt=""><div class="cue"><span>CLICK TO PLAY</span></div></div>
</main>

<script>
{
const G=[
 {id:'hdr',name:'HOT DOG RUN',lines:'HOT DOG<br>RUN',kind:'ENDLESS RUNNER',pitch:'An endless run through New York at night, in a hot dog cart.',url:'https://hotdogrun.badcompany.fyi',bg:'img/hdr-bg.webp',logo:'img/hdr-logo.webp',vid:'vid/hdr-trailer.mp4',poster:'vid/hdr-trailer.jpg'},
 {id:'hh',name:'HELLHOUND',lines:'HELL<br>HOUND',kind:'SIDE-SCROLLER',pitch:'Three heads. One way out. A 16-bit run through The Inferno.',url:'https://hellhound.badcompany.fyi',bg:'img/hh-bg.webp',logo:'img/hh-logo.webp',vid:'vid/hh-trailer.mp4',poster:'vid/hh-trailer.jpg'},
 {id:'gh',name:'GROUP HUG',lines:'GROUP<br>HUG',kind:'HUGGING, MOSTLY',pitch:'One hug becomes a hundred. Meet a Legend every 100 hugs.',url:'https://grouphug.badcompany.fyi',bg:'img/gh-cover.webp',logo:'',vid:'vid/gh-trailer.mp4',poster:'vid/gh-trailer.jpg'},
 {id:'soon',name:'COMING SOON',lines:'COMING<br>SOON',kind:'IN THE LAB',pitch:'Something new is cooking in the lab.',soon:true}
];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const CR={hdr:[['Dev','Sam'],['Platforms','Claude (Build) &amp; ChatGPT (Artwork)'],['Inspired by','NYC Hot Dog Sellers']],
 hh:[['Dev','Sam'],['Platforms','Claude (Build) &amp; ChatGPT (Artwork)'],['Original Artwork','<a href="https://morning.fyi" target="_blank" rel="noopener">MØRNING.FYI</a>']],
 gh:[['Dev','Sam'],['Platforms','Claude (Build) &amp; ChatGPT (Artwork)']]};
const dl=g=>'<dl>'+CR[g.id].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')+'</dl>';
const IB=(i)=>`<button class="ib" type="button" data-cr="${i}" aria-label="Credits">i</button>`;
const play=v=>{const p=v.play();if(p&&p.catch)p.catch(()=>{})};

/* ---------- B · INDEX ---------- */
const desk=()=>matchMedia('(min-width:900px) and (hover:hover)').matches;
$('list').innerHTML=G.map((g,i)=>`<div class="row${g.soon?' ghost':''}" tabindex="0" role="button" data-i="${i}" aria-label="${g.name}">
 <div class="line"><span class="n">${pad(i+1)}</span><span class="name">${g.name}</span><span class="meta">${g.kind}</span>${g.soon?'':IB(i)}</div>
 <div class="open"><div>${g.soon?'<p style="margin:10px 0 14px;font-weight:500;opacity:.7">'+g.pitch+'</p>':`<div class="clipm"><img src="${g.bg}" alt=""><video muted playsinline loop preload="none" data-src="${g.vid}"></video></div>
  <div class="obtns"><a class="pill solid" href="${g.url}" target="_blank" rel="noopener">PLAY NOW</a>${IB(i)}</div>`}</div></div>
</div>`).join('');
const rows=[...document.querySelectorAll('#B .row')];let bi=-1;
function setB(i){bi=i;rows.forEach((r,k)=>r.classList.toggle('on',k===i));$('list').classList.toggle('hovering',i>=0);
 if(desk()){const g=G[i];const c=$('card'),v=$('cardV');
  if(i<0||g.soon){c.classList.remove('on');v.pause();return}
  $('cardBg').src=g.bg;$('cardLg').style.display=g.logo?'':'none';if(g.logo)$('cardLg').src=g.logo;
  if(v.dataset.cur!==g.vid){v.classList.remove('ready');v.dataset.cur=g.vid;v.src=g.vid;v.oncanplay=()=>setTimeout(()=>v.classList.add('ready'),500)}play(v);c.classList.add('on')}
 else{rows.forEach((r,k)=>{const v=r.querySelector('video');if(!v)return;if(k===i){if(!v.src)v.src=v.dataset.src;play(v)}else v.pause()})}}
rows.forEach((r,k)=>{
 r.addEventListener('pointerenter',e=>{if(desk()&&e.pointerType==='mouse')setB(k)});
 r.addEventListener('click',e=>{if(e.target.closest('a'))return;if(e.target.closest('.ib')){e.stopPropagation();showCr(k);return}if(G[k].soon){r.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});return}if(desk()){if(!G[k].soon)window.open(G[k].url,'_blank','noopener')}else setB(bi===k?-1:k)});
 r.addEventListener('keydown',e=>{if(e.target.closest('.ib'))return;if(e.key==='Enter'&&!G[k].soon)window.open(G[k].url,'_blank','noopener')});
 r.addEventListener('focus',()=>{if(desk()||r.matches(':focus-visible'))if(bi!==k)setB(k)})});
$('list').addEventListener('pointerleave',()=>{if(desk())setB(-1)});
// the card trails the cursor and leans into the movement
let mx=innerWidth*.6,my=innerHeight/2,cx=mx,cy=my,tilt=0;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
(function follow(){const c=$('card');if(c&&desk()){const tx=Math.min(innerWidth-310,mx+40),ty=Math.max(20,Math.min(innerHeight-400,my-180));
  const vx=tx-cx;cx+=vx*.14;cy+=(ty-cy)*.14;tilt+=((vx*.05+4)-tilt)*.1;tilt=Math.max(-14,Math.min(18,tilt));
  c.style.transform=`translate(${cx}px,${cy}px) rotate(${tilt}deg)`}requestAnimationFrame(follow)})();
$('bhint').textContent=desk()?'HOVER A NAME TO PEEK · CLICK TO PLAY':'TAP A NAME TO OPEN IT';

/* ---------- B · tiles view ---------- */
$('btiles').innerHTML=G.map((g,i)=>g.soon?`<div class="tile soon">COMING<br>SOON</div>`:`<div class="tile" data-i="${i}"><img class="bg" src="${g.bg}" alt="${g.name}">${g.logo?`<img class="lg" src="${g.logo}" alt="">`:''}<video muted playsinline preload="none" data-src="${g.vid}"></video>
 <button class="tx" type="button" aria-label="Close trailer">✕</button>${IB(i)}<div class="back" aria-hidden="true"><button class="bx" type="button" aria-label="Close credits">✕</button><h3>${g.name}</h3>${dl(g)}</div><div class="tb"><a class="pill solid" href="${g.url}" target="_blank" rel="noopener">PLAY NOW</a><button class="pill trl" type="button">TRAILER</button></div></div>`).join('');
const tiles=[...document.querySelectorAll('#B .tile')];
function sizeTiles(){const box=$('btiles');const h=box.clientHeight;if(!h)return;const w=Math.min(innerWidth*.8,h*345/465,430);tiles.forEach(t=>{t.style.width=w+'px'})}
tiles.forEach(t=>{const v=t.querySelector('video');if(!v)return;const stop=()=>{t.classList.remove('playing');v.pause()};
 t.querySelector('.trl').onclick=()=>{tiles.forEach(o=>{if(o!==t){o.classList.remove('playing');const ov=o.querySelector('video');ov&&ov.pause()}});if(!v.src)v.src=v.dataset.src;t.classList.add('playing');v.currentTime=0;play(v)};
 t.querySelector('.tx').onclick=stop;v.onended=stop;
 const turn=on=>{t.classList.add('turning');setTimeout(()=>{t.classList.toggle('cr',on);t.querySelector('.back').setAttribute('aria-hidden',!on);t.classList.remove('turning')},180)};
 t.querySelector('.ib').onclick=()=>{stop();const r=t.getBoundingClientRect(),b=$('btiles');if(r.left<0||r.right>innerWidth){t.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});setTimeout(()=>turn(true),380)}else turn(true)};
 t.querySelector('.back').addEventListener('click',e=>{if(!e.target.closest('a'))turn(false)})});
function view(v){const tv=v==='tiles';$('B').classList.toggle('tv',tv);document.querySelectorAll('#B .vt button').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $('bhint').textContent=tv?(desk()?'SCROLL SIDEWAYS FOR MORE':'SWIPE FOR MORE'):(desk()?'HOVER A NAME TO PEEK · CLICK TO PLAY':'TAP A NAME TO OPEN IT');
 if(tv){setB(-1);requestAnimationFrame(sizeTiles)}else{tiles.forEach(t=>{t.classList.remove('playing');const x=t.querySelector('video');x&&x.pause()});setB(desk()?-1:0)}
 try{localStorage.setItem('bc_view',v)}catch(e){}}
document.querySelectorAll('#B .vt button').forEach(b=>b.onclick=()=>view(b.dataset.v));
addEventListener('resize',sizeTiles);
/* ---------- B · about box ---------- */
const ABOUT=$('abIn').innerHTML;
function showCr(k){const g=G[k];$('abIn').innerHTML=`<h3>${g.name}</h3>${dl(g)}`;$('abBtn').firstChild.textContent='CREDITS ';abox(true,true)}
function abox(on,keep){if(!on||!keep){if(!on)setTimeout(()=>{if(!$('abox').classList.contains('on')){$('abIn').innerHTML=ABOUT;$('abBtn').firstChild.textContent='ABOUT '}},360);else{$('abIn').innerHTML=ABOUT;$('abBtn').firstChild.textContent='ABOUT '}}$('abox').classList.toggle('on',on);$('B').classList.toggle('abo',on);$('abBtn').setAttribute('aria-expanded',on)}
